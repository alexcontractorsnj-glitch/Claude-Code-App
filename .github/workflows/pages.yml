name: Deploy Gallery to Pages

# Publishes gallery.html to GitHub Pages so it can be previewed at a live URL.
# Self-enables Pages via the API (enablement: true) — no manual settings needed,
# provided the github-pages environment allows this branch to deploy.

on:
  push:
    branches: ["claude/luxury-home-gallery-showcase-IPhGV"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp gallery.html _site/index.html   # root URL shows the gallery
          cp gallery.html _site/gallery.html
          cp GALLERY.md  _site/GALLERY.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
