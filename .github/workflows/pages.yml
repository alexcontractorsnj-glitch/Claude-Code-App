name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/erp-schedule-system-X8DX0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: Pages must be enabled once at Settings -> Pages ->
      # Build and deployment -> Source: "GitHub Actions". The Actions token
      # cannot create the Pages site via API, so this step only reads it.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The app is a static frontend (index.html + src/) served from the repo
      # root; it degrades to local mode without the Node /api backend.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
