name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # BuildFlow has no third-party dependencies — nothing to install.
      - name: Lint (node --check)
        run: npm run lint
      - name: Test (units + API integration)
        run: npm test
